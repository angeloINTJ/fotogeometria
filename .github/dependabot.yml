# Dependabot: the GitHub Actions and the npm packages, monthly.
#
# Every npm dependency is pinned to an exact version (package.json) and its
# tree by package-lock.json, so nothing moves unless a pull request moves it.
# A bump will usually also move the build's size, and tools/check-budget.mjs
# fails until the new sizes are recorded: that is intended, the pull request
# then says what the bump cost.
#
# The development packages are grouped into one pull request a month; a
# runtime dependency (what ships to the browser) gets its own, because it
# changes what users download and may change the third-party notices.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      development:
        dependency-type: development
    ignore:
      # Node's types follow the Node the project runs on: .nvmrc says 22, and
      # the first run (2026-11-26, pull request #1) offered @types/node 26.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8.74.0 supports TypeScript >=4.8.4 <6.1.0, so the
      # project stays on 6.0 (docs/DECISIONS.md). The first run (2026-11-26)
      # tried TypeScript 7 and failed on that peer range. Lift this when
      # typescript-eslint widens it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
